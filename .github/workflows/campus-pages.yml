name: Campus portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: campus-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: mkdir -p public github-pages && cp cdut-campus-map-mobile.jpg public/ && cp cdut-campus-map-mobile.jpg github-pages/
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
